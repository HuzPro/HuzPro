name: snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#a4377b&color_dots=#e3edf0,#b5dfe7,#6cbccb,#2b8fa2,#1a6f80
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff9bcd&color_dots=#161b22,#12404a,#1b6a78,#35a3b6,#6fd6e8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/pulse.mjs ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
